name: Build e Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar e empacotar
        shell: pwsh
        run: |
          $versao = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0' }
          ./build.ps1 -Versao $versao

      - uses: actions/upload-artifact@v4
        with:
          name: BandejaImpressoras
          path: dist/*.zip

      - name: Publicar release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-Item dist/*.zip).FullName --title '${{ github.ref_name }}' --generate-notes
