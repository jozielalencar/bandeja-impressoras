name: Build e Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar programa e instalador .msi
        shell: cmd
        run: |
          if "${{ github.ref_type }}"=="tag" (set VERSAO=${{ github.ref_name }}) else (set VERSAO=v0.0.0)
          call build.cmd %VERSAO:~1%

      - uses: actions/upload-artifact@v4
        with:
          name: BandejaImpressoras
          path: dist/*.msi

      - name: Publicar release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.msi --title "${{ github.ref_name }}" --generate-notes
